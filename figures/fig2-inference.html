<script>/* Standalone SVG particles: native path sampling, SVG units/second.
 * GlassParticleRuntime.create(svg, configs, {globalLimit:512, manual:false})
 * returns pause(), resume(), destroy(), advanceTo(seconds), snapshot().
 * advanceTo uses absolute logical seconds, ignores backwards/nonfinite values,
 * and does not advance while paused, hidden, reduced-motion, or destroyed.
 * manual disables RAF only; native decorative SMIL still follows motion policy.
 * SMIL: every nested <svg> is its own timeline in HTML; pause/resume/hidden/
 * reduced-motion apply to all of them (snapshot().timelines lists their state).
 * Ending decorations (reduced motion, destroy) re-seeks every timeline to its
 * current time so Chromium drops the animated values even while paused.
 * Launch at t=0; interval +/- jitter (seconds), per-emitter uint32 LCG.
 * Optional shooters (shooter_interval > 0): larger, faster particles on an
 * independent seeded schedule of the same emitter; they share the emitter and
 * global caps. Ties use schedule order (config order; small before shooter).
 * Expirations precede launches. Denied launches still
 * consume a schedule event and RNG sample. State is O(schedules + globalLimit).
 * Window gating (config window {start,end} with cycle): a launch time whose
 * phase (time mod cycle) lies outside [start, end) is skipped without an RNG
