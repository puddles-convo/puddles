[project]
name = "puddles"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "openai>=1.40", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
extend-exclude = ["schemas.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.mypy]
ignore_missing_imports = true
exclude = ["tests/"]
